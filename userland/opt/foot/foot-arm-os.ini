# ArmOS Foot defaults.
#
# Use an explicit pixel size: the compositor does not expose a physical DPI
# yet. A 12-pixel em keeps a useful number of rows at 720p; contrast is
# provided by the palette and font rendering instead of oversized glyphs.
# Keep the surface opaque so grayscale glyph coverage is composited once.
font=MesloLGS NF:style=Regular:pixelsize=12
dpi-aware=no
bold-text-in-bright=yes

[colors]
alpha=1.0
foreground=ffffff
background=000000

regular0=000000
regular1=ff5555
regular2=00dd00
regular3=ffff00
regular4=5555ff
regular5=ff55ff
regular6=00dddd
regular7=dddddd

bright0=777777
bright1=ff7777
bright2=55ff55
bright3=ffff55
bright4=7777ff
bright5=ff77ff
bright6=55ffff
bright7=ffffff
